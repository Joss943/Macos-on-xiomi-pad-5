name: Nabu native-port source checks

on:
  push:
    branches:
      - codex/native-sonoma-research
  pull_request:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out port repository
        uses: actions/checkout@v4

      - name: Run NT36523 parser fixtures
        run: python3 -m unittest discover -s lab/nabu -p 'test_*.py' -v

      - name: Run Mach-O, kernelcache, ISA-scan and build-log tool tests
        run: |
          python3 -m unittest discover -s lab/compat -p 'test_*.py' -v
          python3 -m unittest discover -s lab/compat/xnu-build -p 'test_*.py' -v

      - name: Compile and run no-PAC emulator fixtures
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            lab/compat/test_nabu_pauth_emu.c \
            -o "$RUNNER_TEMP/nabu-pauth-fixtures"
          "$RUNNER_TEMP/nabu-pauth-fixtures"

      - name: Apply the XNU patch series to its pinned base
        run: |
          set -eu
          xnu_dir="$RUNNER_TEMP/xnu-12377"
          git clone --filter=blob:none --no-checkout \
            https://github.com/apple-oss-distributions/xnu.git "$xnu_dir"
          git -C "$xnu_dir" checkout --detach \
            ac9718fb1af618d5ce8678d0dc6e8a58f252216f
          bash lab/compat/xnu-build/apply_series.sh "$xnu_dir"
